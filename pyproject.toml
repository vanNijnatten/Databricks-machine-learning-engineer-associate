[project]
    name = "db_ml_associate"
    version = "0.1.0"
    description = "Databricks Machine Learning Associate"
    authors = [
        {name = "J. van Nijnatten"},
    ]
    readme = "README.md"
    license = "MIT"
    license-files = [
        "LICENSE",
    ]
    requires-python = ">=3.12,<3.13"
    classifiers = [
        "Operating System :: OS Independent",
        "Private :: Do Not Upload",
        "Programming Language :: Python :: 3.12",
    ]
    # Pinned to Databricks Runtime 18 LTS ML (see runtime.toml)
    dependencies = [
        "matplotlib==3.10.0",
        "mlflow==3.8.1",
        "numpy==2.1.3",
        "pandas==2.2.3",
        "pyarrow==21.0.0",
        "pyyaml>=6.0.3",
        "rich>=14.2.0",
        "scikit-learn==1.6.1",
        "scipy==1.15.3",
        "sqlalchemy==2.0.39",  # MLflow 3.8.1 imports a pool class removed in SQLAlchemy 2.1
        "typer>=0.20.0",
    ]

[dependency-groups]
    dev = [
        "pre-commit==4.5.0",
        "specify-cli>=1.0.0",
        {include-group = "lint"},
        {include-group = "test"},
        {include-group = "spark"},
        {include-group = "tuning"},
        {include-group = "databricks"},
    ]
    lint = [
        "ruff==0.14.6",
        "mypy==1.18.2",
        "bandit==1.9.1",
        "radon>=6.0.1",
        "types-PyYAML>=6.0",
    ]
    spark = [
        "pyspark==4.1.0",
    ]
    tuning = [
        "hyperopt==0.2.7",
        "optuna==3.6.1",
        "setuptools==78.1.1",  # hyperopt 0.2.7 imports pkg_resources
    ]
    databricks = [
        "databricks-feature-engineering==0.13.0.1",
        "databricks-sdk==0.67.0",
    ]
    test = [
        "pytest==9.0.1",
        "pytest-cov>=7.0.0",
        "pytest-mock==3.15.1",
    ]

[project.scripts]
    db-ml-associate = "db_ml_associate:main"

[build-system]
    requires = ["uv_build>=0.12.5,<0.13"]
    build-backend = "uv_build"

[tool.uv]
    package = true
    required-version = "0.12.5"

[tool.ruff]
    target-version = "py312"
    line-length = 120  # matches the editor ruler in .devcontainer/devcontainer.json
    # Typographic characters used deliberately in teaching comments and docstrings
    lint.allowed-confusables = ["×", "–", "→", "’"]

    lint.select = [
        "A",   # flake8-builtins
        "ANN", # flake8-annotations
        "B",   # flake8-bugbear
        "BLE", # flake8-blind-except
        "C",   # flake8-comprehensions
        "COM", # flake8-commas
        "C90", # mccabe
        "E",   # pycodestyle errors
        "F",   # pyflakes
        "G",   # flake8-logging-format
        "I",   # isort
        "PD",  # pandas-vet
        "RUF", # ruff-specific rules
        "S5",  # flake8-bandit
        "T10", # flake&-debugger
        "T20", # flake8-print
        "W",   # pycodestyle warnings
    ]

    lint.ignore = [
        "W191",   # tab-indentation,
        "E111",   # indentation-with-invalid-multiple
        "E114",   # indentation-with-invalid-multiple-comment
        "E117",   # over-indented
        "D206",   # indent-with-spaces
        "D300",   # triple-single-quotes
        "Q000",   # bad-quotes-inline-string
        "Q001",   # bad-quotes-multiline-string
        "Q002",   # bad-quotes-docstring
        "Q003",   # avoidable-escaped-quote
        "COM812", # missing-trailing-comma
        "COM819", # prohibited-trailing-comma
        "ISC001", # single-line-implicit-string-concatenation
        "ISC002", # multi-line-implicit-string-concatenation
        "ANN204", # missing-return-type-special-method
        "S105",   # hardcoded-password-string
        "E501",   # line-too-long
    ]

    exclude = [
        "tests/data"
    ]


[tool.ruff.lint.isort]
    known-first-party = ["db_ml_associate", "helpers"]


[tool.ruff.format]
    quote-style = "double"
    indent-style = "space"
    line-ending = "auto"
    docstring-code-format = true
    docstring-code-line-length = 50


[tool.ruff.lint.per-file-ignores]
    "tests/**/*.py" = [
        "S101", # flake8-bandit: assert
    ]
    "__init__.py" = [
        "F401",
    ]
    "src/db_ml_associate/content/loaders.py" = [
        "ANN401", # parsed YAML is untyped by nature; values are converted to typed entities immediately
    ]
    "notebooks/*.py" = [
        "F821", # spark, dbutils, display are injected by the Databricks runtime
        "E402", # imports after %pip install cells
        "T201", # tutorials print results
    ]
    "notebook_run unit_tests.py" = [
        "F821",
        "E402",
        "S101"
    ]


[tool.mypy]
    python_version = "3.12"
    exclude = [
        "tests",
    ]
    ignore_missing_imports = true


[tool.bandit]
    exclude_dirs = [
        "tests"
    ]


[tool.radon]
    order = "SCORE"
    cc_min = "C"


[tool.pytest]
    addopts = [
        "--strict-markers",
        "--import-mode=importlib",
    ]
    markers = [
        "configuration",
        "data",
        "databricks: requires a Databricks workspace (auto-skipped without one)",
        "network: requires network access (opt-in with --run-network)",
        "slow",
        "spark: requires a local Spark session (Java 17+)",
        "user_interface",
    ]
    testpaths = [
        "tests"
    ]
    pythonpath = [
        "tests"
    ]
