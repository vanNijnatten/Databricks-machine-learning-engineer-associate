name: Continuous_Integration


on:
    push:
        branches:
            - main
            - master
            - patch/**
    
    pull_request:
        branches:
            - main
            - master
            - patch/**

    schedule:
        - cron: "0 6 * * 1" # Mondays 06:00 UTC: docs link check

    workflow_dispatch:


permissions:
    contents: read # to fetch code (actions/checkout)


defaults:
    run:
        shell: bash


env:
    SRC_PATH: src
    TST_PATH: tests


jobs:
    static_analysis:
        name: Static Analysis
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Install UV
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install the project
              run: |
                uv sync \
                  --all-groups

            - name: Check book content
              run: |
                uv run db-ml-associate book check

            - name: Run Ruff
              run: |
                uv run ruff check $SRC_PATH \
                  --no-fix \
                  --output-format=github

            - name: Run MyPy
              run: |
                uv run mypy $SRC_PATH \
                  --config-file pyproject.toml \
                  --output=json \
                  | jq -r '"::error title=Mypy issue,file=\(.file),line=\(.line),col=\(.column)::\(.message)"'

            - name: Run Bandit
              run: |
                {
                  echo "Bandit:"
                  echo "\`\`\`"
                  uv run bandit $SRC_PATH \
                    -c pyproject.toml \
                    -r \
                    -n 3 \
                    -lll
                  echo "\`\`\`"
                } >> $GITHUB_STEP_SUMMARY

            - name: Run Radon
              run: |
                {
                  echo "Radon:"
                  echo "\`\`\`"
                  uv run radon cc $SRC_PATH
                  echo "\`\`\`"
                }  >> $GITHUB_STEP_SUMMARY

    smoke_test:
        name: Smoke Test
        if: github.event_name != 'schedule'
        runs-on: ubuntu-latest
        needs:
            - static_analysis

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Install UV
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install Java (local Spark tests)
              uses: actions/setup-java@v5
              with:
                distribution: temurin
                java-version: "17"

            - name: Install the project
              run: |
                uv sync \
                  --all-groups

            - name: Run tests
              run: |
                uv run pytest $TST_PATH \
                  --cov=$SRC_PATH \
                  --doctest-modules \
                  --cov-report markdown-append:$GITHUB_STEP_SUMMARY

    docs_links:
        name: Documentation Links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        steps:
            - name: checkout
              uses: actions/checkout@v6

            - name: Install UV
              uses: astral-sh/setup-uv@v10.0.1

            - name: Install the project
              run: |
                uv sync \
                  --all-groups

            - name: Check every docs reference and the exam guide
              run: |
                uv run pytest $TST_PATH \
                  -m network \
                  --run-network
