- id: online-feature-store
  url: https://docs.databricks.com/aws/en/machine-learning/feature-store/online-feature-store
  title: Databricks Online Feature Stores
  claim: >-
    Online Feature Stores are powered by Lakebase; create_online_store provisions one and publish_table syncs
    an offline feature table (primary key, Change Data Feed for TRIGGERED/CONTINUOUS) for low-latency lookup.
  objectives: [S1.10]
  chapters: [3]
  last_verified: 2026-10-14
  status: discrepancy
  note: >-
    The page shows publish_table(..., publish_mode="TRIGGERED"|"CONTINUOUS"|"SNAPSHOT"). The client
    preinstalled in Runtime 18 LTS ML (databricks-feature-engineering 0.13.0.1) has no publish_mode
    argument: streaming=False publishes TRIGGERED, streaming=True CONTINUOUS, and it raises an error unless
    Change Data Feed is enabled on the source table. The book uses the runtime's signature.

