# Target Databricks runtime for all tutorial code (constitution Principle II).
# Single source of truth: pyproject.toml pins are tested against this file.
databricks_runtime = "18 LTS ML"
docs_snapshot = 2026-10-14
python = "3.12.3"
spark = "4.1.0"

[libraries]
mlflow = "3.8.1"                            # runtime ships mlflow-skinny 3.8.1
scikit-learn = "1.6.1"
pandas = "2.2.3"
numpy = "2.1.3"
scipy = "1.15.3"
matplotlib = "3.10.0"
pyarrow = "21.0.0"
sqlalchemy = "2.0.39"                        # mlflow's tracking store; 2.1 is incompatible with mlflow 3.8.1
optuna = "3.6.1"
hyperopt = "0.2.7"                          # not preinstalled after 16.4 LTS ML: %pip install hyperopt==0.2.7
setuptools = "78.1.1"                       # preinstalled; provides pkg_resources, which hyperopt 0.2.7 imports
databricks-feature-engineering = "0.13.0.1"
databricks-sdk = "0.67.0"
